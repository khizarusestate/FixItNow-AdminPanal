name: One-time status filter fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix Reviews and Advertisements status filter cards'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch status cards
        run: |
          node <<'NODE'
          const fs = require('fs');

          const reviewsPath = 'src/Components/Reviews.jsx';
          const adsPath = 'src/Components/Advertisements.jsx';

          let reviews = fs.readFileSync(reviewsPath, 'utf8');
          const reviewsCards = [
            [
              /<div className="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">[\s\S]*?<p className="text-2xl font-bold text-slate-900">\{stats\.total\}<\/p>\n        <\/div>/,
              `<button type="button" onClick={() => { setFilter('all'); setPage(1); }} className={\`rounded-xl border border-slate-200 bg-white p-4 text-left shadow-sm transition-all hover:border-blue-300 hover:shadow-md \${filter === 'all' ? 'ring-2 ring-blue-500' : ''}\`}>\n          <div className="flex items-center gap-2 mb-2">\n            <MessageSquare size={20} className="text-slate-500" />\n            <span className="text-sm font-medium text-slate-600">Total</span>\n          </div>\n          <p className="text-2xl font-bold text-slate-900">{stats.total}</p>\n        </button>`
            ],
            [
              /<div className="rounded-xl border border-yellow-200 bg-yellow-50 p-4 shadow-sm">[\s\S]*?<p className="text-2xl font-bold text-yellow-900">\{stats\.pending\}<\/p>\n        <\/div>/,
              `<button type="button" onClick={() => { setFilter('pending'); setPage(1); }} className={\`rounded-xl border border-yellow-200 bg-yellow-50 p-4 text-left shadow-sm transition-all hover:border-yellow-300 hover:shadow-md \${filter === 'pending' ? 'ring-2 ring-yellow-500' : ''}\`}>\n          <div className="flex items-center gap-2 mb-2">\n            <Clock size={20} className="text-yellow-600" />\n            <span className="text-sm font-medium text-yellow-700">Pending</span>\n          </div>\n          <p className="text-2xl font-bold text-yellow-900">{stats.pending}</p>\n        </button>`
            ],
            [
              /<div className="rounded-xl border border-emerald-200 bg-emerald-50 p-4 shadow-sm">[\s\S]*?<p className="text-2xl font-bold text-emerald-900">\{stats\.approved\}<\/p>\n        <\/div>/,
              `<button type="button" onClick={() => { setFilter('approved'); setPage(1); }} className={\`rounded-xl border border-emerald-200 bg-emerald-50 p-4 text-left shadow-sm transition-all hover:border-emerald-300 hover:shadow-md \${filter === 'approved' ? 'ring-2 ring-emerald-500' : ''}\`}>\n          <div className="flex items-center gap-2 mb-2">\n            <CheckCircle size={20} className="text-emerald-600" />\n            <span className="text-sm font-medium text-emerald-700">Approved</span>\n          </div>\n          <p className="text-2xl font-bold text-emerald-900">{stats.approved}</p>\n        </button>`
            ],
            [
              /<div className="rounded-xl border border-red-200 bg-red-50 p-4 shadow-sm">[\s\S]*?<p className="text-2xl font-bold text-red-900">\{stats\.rejected\}<\/p>\n        <\/div>/,
              `<button type="button" onClick={() => { setFilter('rejected'); setPage(1); }} className={\`rounded-xl border border-red-200 bg-red-50 p-4 text-left shadow-sm transition-all hover:border-red-300 hover:shadow-md \${filter === 'rejected' ? 'ring-2 ring-red-500' : ''}\`}>\n          <div className="flex items-center gap-2 mb-2">\n            <XCircle size={20} className="text-red-600" />\n            <span className="text-sm font-medium text-red-700">Rejected</span>\n          </div>\n          <p className="text-2xl font-bold text-red-900">{stats.rejected}</p>\n        </button>`
            ]
          ];

          for (const [pattern, replacement] of reviewsCards) {
            const matches = reviews.match(pattern);
            if (!matches || matches.length !== 1) throw new Error(`Reviews card pattern mismatch: ${pattern}`);
            reviews = reviews.replace(pattern, replacement);
          }
          fs.writeFileSync(reviewsPath, reviews);

          let ads = fs.readFileSync(adsPath, 'utf8');
          const oldAds = `<div key={key} className={\`rounded-xl border \${meta[3]} \${meta[2]} p-4\`}><p className="text-xs font-medium uppercase tracking-wider text-slate-500">{meta[0]}</p><p className={\`mt-1 text-2xl font-bold \${meta[1]}\`}>{stats[key]}</p></div>`;
          const newAds = `<button type="button" onClick={() => setFilter(key === 'total' ? 'all' : key)} className={\`rounded-xl border \${meta[3]} \${meta[2]} p-4 text-left transition-all hover:shadow-md \${filter === (key === 'total' ? 'all' : key) ? 'ring-2 ring-blue-500' : ''}\`}><p className="text-xs font-medium uppercase tracking-wider text-slate-500">{meta[0]}</p><p className={\`mt-1 text-2xl font-bold \${meta[1]}\`}>{stats[key]}</p></button>`;
          if (!ads.includes(oldAds)) throw new Error('Advertisements status card pattern not found');
          ads = ads.replace(oldAds, newAds);
          fs.writeFileSync(adsPath, ads);
          NODE

      - name: Validate
        run: |
          npm ci
          npm run build
          npm test -- --run

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-status-filter-fix.yml .status-filter-trigger
          git add src/Components/Reviews.jsx src/Components/Advertisements.jsx .github/workflows/one-time-status-filter-fix.yml .status-filter-trigger
          git commit -m "Fix Reviews and Advertisements status filter cards"
          git push origin main
