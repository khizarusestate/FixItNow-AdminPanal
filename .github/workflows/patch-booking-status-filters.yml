name: Patch booking status filters

on:
  push:
    paths:
      - "scripts/patch-booking-status-filters.mjs"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node scripts/patch-booking-status-filters.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build admin panel
        run: npm run build
      - name: Commit patched component
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Components/Bookings.jsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add On The Way and In Progress booking filters"
          git push
